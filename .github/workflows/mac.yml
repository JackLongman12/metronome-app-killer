name: Mac build and release

# Every push to main that touches the Mac app builds it on a GitHub Mac and
# publishes a Release tagged mac-b<run number>, with a .dmg (for people) and a
# .zip (for the in-app updater). It's never marked "latest", so the Android
# app's updater (which reads the latest release) only ever sees Android builds.
on:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - "app/src/main/assets/sounds/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the app
        run: sh mac/build.sh

      # Real numbers from a real Mac (GitHub's Apple Silicon runner). Never fails the build.
      - name: Measure speed and resources
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP="mac/build/Metronome Killer.app"
          BIN="$APP/Contents/MacOS/MetronomeKiller"
          {
            echo "STAT dmg_kb $(( $(stat -f%z mac/build/*.dmg) / 1024 ))"
            echo "STAT app_on_disk_kb $(du -sk "$APP" | cut -f1)"
            echo "STAT program_kb $(( $(stat -f%z "$BIN") / 1024 ))"
            "$BIN" --benchmark || echo "STAT benchmark failed"
            # The very first launch of a new download includes macOS's one-time security scan.
            MK_LAUNCH_PROBE=1 "$BIN" | grep STAT | sed 's/launch_ms/launch_first_ms/' || true
            MK_LAUNCH_PROBE=1 "$BIN" | grep STAT || echo "STAT launch_ms unavailable"
            # Idle: open the app, let it settle for 5 s, then measure CPU used over the next 10 s.
            "$BIN" & PID=$!
            sleep 5
            A=$(ps -o time= -p $PID | awk -F'[:.]' '{print ($1*60+$2)*100+$3}')
            sleep 10
            B=$(ps -o time= -p $PID | awk -F'[:.]' '{print ($1*60+$2)*100+$3}')
            echo "STAT idle_cpu_percent $(echo "$A $B" | awk '{printf "%.2f", ($2-$1)/10}')"
            echo "STAT idle_memory_mb $(( $(ps -o rss= -p $PID) / 1024 ))"
            kill $PID || true
          } 2>&1 | tee bench.txt
          { echo "### Mac build ${BUILD_NUMBER}: measurements"; echo '```'; grep STAT bench.txt | sed 's/^STAT //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'mac-b*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            NOTES=$(git log --no-merges --pretty='- %s' "$PREV..HEAD" -- mac app/src/main/assets/sounds)
          else
            NOTES="First Mac build."
          fi
          if [ -f bench.txt ]; then
            NOTES="$NOTES

          Measured on GitHub's Mac (Apple Silicon):
          $(grep STAT bench.txt | sed 's/^STAT /    /')"
          fi
          gh release create "mac-b${BUILD_NUMBER}" \
            "mac/build/MetronomeKiller-mac-b${BUILD_NUMBER}.dmg" \
            "mac/build/MetronomeKiller-mac-b${BUILD_NUMBER}.zip" \
            --title "Mac build ${BUILD_NUMBER}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest=false
